# Modular monolith: one codebase, one database, several deployables.
# Scale: docker compose up --build --scale api=3 --scale worker=2
x-database-url: &database-url postgresql://postgres:postgres@postgres:5432/acme

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: acme
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acme"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot. api and worker start only after it exits 0, so N replicas never race on migrations.
  migrate:
    build:
      context: .
      dockerfile: services/migrate/Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  # No container_name and no host port: it scales. The edge is the public entry point.
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: *database-url
      WEB_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-0123456789}
      BETTER_AUTH_URL: http://localhost:${EDGE_PORT:-3000}
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      JOB_INTERVAL_MS: ${JOB_INTERVAL_MS:-30000}
      PURGE_AFTER_DAYS: ${PURGE_AFTER_DAYS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${EDGE_PORT:-3000}:3000"
    volumes:
      - ./services/edge/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:${EDGE_PORT:-3000}
    restart: unless-stopped
    depends_on:
      - edge
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  pgdata:
