services:
  postgres:
    image: postgres:16-alpine
    container_name: acme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh

  todos:
    build:
      context: .
      dockerfile: services/service-todos/Dockerfile
    container_name: acme-todos
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/todos_service
    depends_on:
      - postgres
    ports:
      - "3001:3001"

  gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: acme-gateway
    restart: unless-stopped
    environment:
      PORT: 3000
      TODOS_URL: http://todos:3001
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auth_service
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-0123456789}
      BETTER_AUTH_URL: http://localhost:3000
      TRUSTED_ORIGINS: http://localhost:5173
    depends_on:
      - postgres
      - todos
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    container_name: acme-web
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "5173:80"

volumes:
  pgdata:
