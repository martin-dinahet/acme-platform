services:
  postgres:
    image: postgres:16-alpine
    container_name: acme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh

  # Only public backend entry point. The services below have no published ports.
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: acme-gateway
    restart: unless-stopped
    environment:
      PORT: 3000
      WEB_ORIGINS: http://localhost:5173
      AUTH_SERVICE_URL: http://auth:3001
      TODOS_SERVICE_URL: http://todos:3002
      ROUTINES_SERVICE_URL: http://routines:3003
    depends_on:
      - auth
      - todos
      - routines
    ports:
      - "3000:3000"

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: acme-auth
    restart: unless-stopped
    environment:
      PORT: 3001
      AUTH_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auth_service
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-0123456789}
      BETTER_AUTH_URL: http://localhost:3000
      TRUSTED_ORIGINS: http://localhost:5173
    depends_on:
      - postgres

  todos:
    build:
      context: .
      dockerfile: services/todos/Dockerfile
    container_name: acme-todos
    restart: unless-stopped
    environment:
      PORT: 3002
      TODOS_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/todos_service
    depends_on:
      - postgres

  routines:
    build:
      context: .
      dockerfile: services/routines/Dockerfile
    container_name: acme-routines
    restart: unless-stopped
    environment:
      PORT: 3003
      ROUTINES_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/routines_service
      TODOS_SERVICE_URL: http://todos:3002
    depends_on:
      - postgres
      - todos

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    container_name: acme-frontend
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "5173:80"

volumes:
  pgdata:
